{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-md rounded-lg border border-slate-200 bg-white p-6">
  <h1 class="mb-4 text-2xl font-bold text-navy">Citizen log in</h1>
  <form method="post" class="space-y-4">{% csrf_token %}
    {% for e in form.non_field_errors %}<p class="text-sm text-red-600">{{ e }}</p>{% endfor %}
    {% for f in form %}<div><label class="mb-1 block text-sm font-medium">{{ f.label }}</label>{{ f }}</div>{% endfor %}
    <button class="w-full rounded-md bg-teal-600 py-2 font-medium text-white hover:bg-teal-700">Log in</button>
  </form>
  <p class="mt-4 text-sm">New here? <a class="text-teal-700 underline" href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
