  <span class="rounded-full bg-blue-100 px-2 py-0.5 text-blue-800">{{ c.get_status_display }}</span>
  <span class="rounded-full bg-amber-100 px-2 py-0.5 text-amber-800">{{ c.get_priority_level_display }} priority</span>

</div>
