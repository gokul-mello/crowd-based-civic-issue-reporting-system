<a href="{{ c.get_absolute_url }}" class="block rounded-lg border border-slate-200 bg-white p-4 hover:border-teal-600">
  <div class="flex flex-wrap items-center gap-2 text-xs">
    <span class="rounded-full px-2 py-0.5 font-medium
      {% if c.priority_level == 'critical' %}bg-red-100 text-red-800{% elif c.priority_level == 'high' %}bg-orange-100 text-orange-800{% elif c.priority_level == 'medium' %}bg-amber-100 text-amber-800{% else %}bg-slate-100 text-slate-700{% endif %}">{{ c.get_priority_level_display }} · {{ c.priority_score }}</span>
    <span class="rounded-full bg-slate-100 px-2 py-0.5">{{ c.get_category_display }}</span>
    <span class="rounded-full px-2 py-0.5 {% if c.status == 'resolved' %}bg-teal-100 text-teal-800{% elif c.status == 'rejected' %}bg-red-100 text-red-800{% else %}bg-blue-100 text-blue-800{% endif %}">{{ c.get_status_display }}</span>
    <span class="ml-auto text-slate-500">{{ c.votes_count }} vote{{ c.votes_count|pluralize }}</span>
  </div>
  <h3 class="mt-2 font-semibold text-navy">{{ c.title }}</h3>
  <p class="text-sm text-slate-500">{{ c.address }} · {{ c.created_at|date:"d M Y" }}</p>
</a>
