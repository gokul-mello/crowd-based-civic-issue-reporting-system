{% extends "base.html" %}
{% block head %}<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>{% endblock %}
{% block content %}
<h1 class="mb-4 text-2xl font-bold text-navy">Analytics</h1>
<div class="grid gap-6 md:grid-cols-3">
  <div class="rounded-lg border border-slate-200 bg-white p-4"><h2 class="mb-2 font-semibold">By category</h2><canvas id="c1"></canvas></div>
  <div class="rounded-lg border border-slate-200 bg-white p-4"><h2 class="mb-2 font-semibold">By status</h2><canvas id="c2"></canvas></div>
  <div class="rounded-lg border border-slate-200 bg-white p-4"><h2 class="mb-2 font-semibold">By priority</h2><canvas id="c3"></canvas></div>
</div>
{{ data|json_script:"data" }}
<script>
  const d = JSON.parse(document.getElementById('data').textContent);
  const pal = ['#072849', '#0d9488', '#0171c6', '#d97706', '#dc2626', '#7c3aed', '#64748b'];
  const mk = (id, type, s) => new Chart(document.getElementById(id), {type,
    data: {labels: s.labels, datasets: [{data: s.data, backgroundColor: pal}]},
    options: {plugins: {legend: {display: type !== 'bar'}}, scales: type === 'bar' ? {y: {beginAtZero: true, ticks: {precision: 0}}} : {}}});
  mk('c1', 'bar', d.category); mk('c2', 'doughnut', d.status); mk('c3', 'doughnut', d.priority);
</script>
{% endblock %}
